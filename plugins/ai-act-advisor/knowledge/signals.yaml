# Señales que usan la auditoría y los hooks. Las palabras se buscan como
# identificador completo, con «_» como separador: «nif» no casa con
# «planificadas», pero sí con «cliente_nif». Origen:
# docs/investigacion/ai-act-investigacion.md (18.2) y las dos auditorías de
# prueba de 2026-11-17.

pii_terms:
  - email
  - e_mail
  - correo
  - correo_electronico
  - dni
  - nif
  - nie
  - pasaporte
  - passport
  - telefono
  - phone
  - phone_number
  - mobile
  - iban
  - cuenta_bancaria
  - bank_account
  - card_number
  - fecha_nacimiento
  - birth_date
  - birthdate
  - date_of_birth
  - dob
  - direccion
  - address
  - codigo_postal
  - postal_code
  - zip_code
  - ip_address
  - nombre_completo
  - full_name
  - first_name
  - last_name
  - apellido
  - apellidos
  - ssn
  - cups
  - geolocalizacion
  - latitude
  - longitude

