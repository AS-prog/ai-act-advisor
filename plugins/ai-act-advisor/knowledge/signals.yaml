# Palabras que un buscador ingenuo marcaría por error en proyectos de datos.
# Cada repo puede añadir las suyas en .ai-act/rules.json («exclusions»).
exclusions:
  - predicate
  - predicado
  - model
  - modelo
  - row_hash
  - schema_hash
  - quick_xor
  - cliente_id
  - client_id
  - client_filter
  - usuario
  - politica
  - movil
