# Fechas de aplicación del AI Act (art. 113 y 111, tras el Reglamento 2026/1744).
# Fuente: docs/investigacion/ai-act-investigacion.md, secciones 3 y 18.3.
- desde: 2025-02-02
  aplica: [art. 4, art. 5.1.a-h]
  que: Alfabetización en IA y prácticas prohibidas
- desde: 2025-08-02
  aplica: [arts. 51-55]
  que: Obligaciones de los modelos de IA de uso general (GPAI)
- desde: 2026-08-02
  aplica: [art. 50, art. 101]
  que: Transparencia y poder sancionador de la Comisión sobre GPAI
- desde: 2026-12-02
  aplica: [art. 5.1.b bis, art. 5.1.b ter, art. 111.4]
  que: Nuevas prohibiciones (deepfakes íntimos, CSAM) y marcado art. 50.2 para sistemas anteriores al 2026-08-02
- desde: 2027-12-02
  aplica: [arts. 6-27, anexo III]
  que: Alto riesgo del anexo III
- desde: 2028-08-02
  aplica: [art. 6.1, anexo I]
  que: Alto riesgo del anexo I
